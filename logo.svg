<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Background -->
  <path d="M50 8 L85 22 V50 C85 70 50 92 50 92 C50 92 15 70 15 50 V22 Z" fill="url(#gradLogo)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  
  <!-- Laurel / Wreath leaves outline -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Graduation Cap / Book Symbol -->
  <!-- Open Book -->
  <path d="M50 64 C42 60 30 60 26 62 V42 C30 40 42 40 50 44 C58 40 70 40 74 42 V62 C70 60 58 60 50 64 Z" fill="rgba(255,255,255,0.92)" />
  <line x1="50" y1="44" x2="50" y2="64" stroke="#1d4ed8" stroke-width="2" />

  <!-- Torch / Flame of Wisdom above Book -->
  <path d="M50 24 C53 28 55 33 50 37 C45 33 47 28 50 24 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="50" cy="30" r="1.5" fill="#fff" />

  <!-- Star of Excellence at top -->
  <polygon points="50,14 51.5,18 55,18 52,20.5 53.5,24 50,22 46.5,24 48,20.5 45,18 48.5,18" fill="url(#goldGrad)" />
</svg>
